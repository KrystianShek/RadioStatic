name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Veraltete Läufe desselben Branches bzw. Pull Requests abbrechen
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-latest
            # Universal Binary (Apple Silicon und Intel)
            cmake_args: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - name: Windows
            os: windows-latest

    steps:
      - name: Checkout (inkl. JUCE-Submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Paketliste siehe JUCE/docs/Linux Dependencies.md
      - name: Abhängigkeiten installieren
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake make pkg-config \
            libasound2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev

      # CMAKE_BUILD_TYPE gilt für Single-Config-, --config für Multi-Config-Generatoren
      - name: Konfigurieren
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Bauen
        run: cmake --build build --config Release --parallel 4

      # upload-artifact verwirft Dateirechte, daher werden Linux und macOS als tar gepackt
      - name: Artefakte packen
        if: runner.os != 'Windows'
        working-directory: build/RadioStatic_artefacts/Release
        run: |
          tar -czf "$RUNNER_TEMP/RadioStatic-${{ matrix.name }}-VST3.tar.gz" VST3
          tar -czf "$RUNNER_TEMP/RadioStatic-${{ matrix.name }}-Standalone.tar.gz" Standalone

      - name: VST3 hochladen
        uses: actions/upload-artifact@v7
        with:
          name: RadioStatic-${{ matrix.name }}-VST3
          path: ${{ runner.os == 'Windows' && 'build/RadioStatic_artefacts/Release/VST3' || format('{0}/RadioStatic-{1}-VST3.tar.gz', runner.temp, matrix.name) }}
          if-no-files-found: error

      - name: Standalone hochladen
        uses: actions/upload-artifact@v7
        with:
          name: RadioStatic-${{ matrix.name }}-Standalone
          path: ${{ runner.os == 'Windows' && 'build/RadioStatic_artefacts/Release/Standalone' || format('{0}/RadioStatic-{1}-Standalone.tar.gz', runner.temp, matrix.name) }}
          if-no-files-found: error
